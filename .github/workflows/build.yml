name: Armar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.9/bin" >> $GITHUB_PATH
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Bajar modelo de IA
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/efficientdet_lite0.tflite \
            https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - run: cp app/build/outputs/apk/debug/app-debug.apk neuro-cam.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Neuro Cam ${{ github.run_number }}
          files: neuro-cam.apk
          make_latest: true
